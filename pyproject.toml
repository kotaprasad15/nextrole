[project]
name = "nextrole"
version = "0.1.0"
description = "Multi-agent job search and outreach platform (prompting, tool use, orchestration; no fine-tuning)."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "tenacity>=8.3",
    "fastapi>=0.149.0",
    "uvicorn[standard]>=0.54.0",
    "streamlit>=1.66.0",
    "pypdf>=6.21.1",
    "python-docx>=1.2.0",
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.2",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nextrole"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI idiom: Depends/File/Form in argument defaults are intentional.
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form"]
